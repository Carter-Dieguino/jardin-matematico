// ── las barras se ponen solas ─────────────────────────────────
// El teclado numérico de un móvil no tiene «/»: obligar a buscarla
// convierte teclear la fecha en un fastidio. Se escriben 8 dígitos
// y ya. Si alguien prefiere escribir «6 de octubre de 2001», en
// cuanto teclea una letra la máscara se aparta y no estorba.
function fechaConBarras(d){
  if(d.length <= 2) return d;
  if(d.length <= 4) return d.slice(0, 2) + '/' + d.slice(2);
  return d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4);
}

const MAIL_KEY = document.getElementById('mail-key');
MAIL_KEY.addEventListener('input', e => {
  const bruto = MAIL_KEY.value;
  if(!bruto){ delete MAIL_KEY.dataset.libre; delete MAIL_KEY.dataset.previo; return; }
  // En cuanto escribe algo que NO sea dígito o barra —un guion, un
  // espacio, el mes con letra— la máscara se aparta del todo y ya no
  // vuelve a tocar nada hasta que el campo se vacíe. Antes se limitaba
  // a tragarse el guion, y una fecha con guiones acababa convertida en
  // otra distinta e inválida, que no deja entrar a nadie.
  if(!/^[\d/]*$/.test(bruto)) MAIL_KEY.dataset.libre = '1';
  if(MAIL_KEY.dataset.libre) return;

  const previo = MAIL_KEY.dataset.previo || '';
  const pos = MAIL_KEY.selectionStart == null ? bruto.length : MAIL_KEY.selectionStart;
  let digitos = bruto.replace(/\D/g, '').slice(0, 8);
  let antes = bruto.slice(0, pos).replace(/\D/g, '').length;

  // borrar encima de una barra tiene que llevarse el dígito de al lado,
  // o el cursor se queda atascado sin que pase nada
  if(e.inputType === 'deleteContentBackward' &&
     digitos.length === previo.replace(/\D/g, '').length && antes > 0){
    digitos = digitos.slice(0, antes - 1) + digitos.slice(antes);
    antes--;
  }

  const salida = fechaConBarras(digitos);
  MAIL_KEY.value = salida;
  MAIL_KEY.dataset.previo = salida;

  // el cursor vuelve detrás del mismo dígito, no al final
  let n = 0, i = 0;
  for(; i < salida.length && n < antes; i++) if(/\d/.test(salida[i])) n++;
  try{ MAIL_KEY.setSelectionRange(i, i); }catch(err){}
});
document.getElementById('mail-back').addEventListener('click', volverAtras);
document.getElementById('mail-new').addEventListener('click', nuevaCarta);
document.getElementById('mail-refresh').addEventListener('click', () => cargarLista());
document.getElementById('mail-out').addEventListener('click', () => {
  // el borrador y las cartas sin enviar NO se tocan: son suyas y
  // llevan dueño, asi que esperan a que vuelva a entrar
  store.del(K_CACHE); store.del(K_LEIDAS);
  MAIL.items = []; MAIL.resumen = null; MAIL.leida = null;
  olvidarSesion();
  setMailState('lock');
  setTimeout(() => { const k = document.getElementById('mail-key'); if(k) k.focus(); }, 80);
});
function listoParaImprimir(){
  const w = document.getElementById('mail-wrap');
  return vistaActual() === 'cartas' && w && w.dataset.state === 'read';
}
// beforeprint cubre tanto el botón como el Cmd+P del navegador
window.addEventListener('beforeprint', () => {
  document.documentElement.classList.toggle('imprimiendo-carta', listoParaImprimir());
});
window.addEventListener('afterprint', () => {
  document.documentElement.classList.remove('imprimiendo-carta');
});
document.getElementById('mail-print').addEventListener('click', () => {
  // Safari en iOS no siempre dispara beforeprint: se pone a mano también
  document.documentElement.classList.toggle('imprimiendo-carta', listoParaImprimir());
  try{ window.print(); }catch(e){}
  setTimeout(() => document.documentElement.classList.remove('imprimiendo-carta'), 1500);
});

document.getElementById('mail-retirar').addEventListener('click', retirarCarta);

document.getElementById('mail-upload').addEventListener('click', () => document.getElementById('mail-txt').click());
document.getElementById('mail-txt').addEventListener('change', e => {
  if(e.target.files && e.target.files[0]) cargarTexto(e.target.files[0]);
  e.target.value = '';
});

// Arrastrar y soltar sobre el panel de escritura. Sin preventDefault en
// dragover el navegador nunca dispara drop, y sobre un textarea ademas
// pegaria la ruta del archivo como texto.
const MAIL_WPANE = document.getElementById('mail-write');
['dragenter','dragover'].forEach(ev => MAIL_WPANE.addEventListener(ev, e => {
  e.preventDefault(); e.stopPropagation();
  document.getElementById('mail-text').classList.add('mail-drop');
}));
['dragleave','drop'].forEach(ev => MAIL_WPANE.addEventListener(ev, e => {
  e.preventDefault(); e.stopPropagation();
  document.getElementById('mail-text').classList.remove('mail-drop');
}));
MAIL_WPANE.addEventListener('drop', e => {
  const fs = e.dataTransfer && e.dataTransfer.files;
  if(fs && fs.length) repartirArchivos(Array.prototype.slice.call(fs));
});
document.getElementById('mail-titulo').addEventListener('input', () => guardarBorrador());
document.getElementById('mail-sobre').addEventListener('input', () => guardarBorrador());
['mail-lugar','mail-saludo-in','mail-despedida','mail-firma'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => guardarBorrador());
});
document.getElementById('mail-when').addEventListener('change', () => { applyMailLang(); guardarBorrador(true); });
document.getElementById('mail-when-btn').addEventListener('click', () => {
  const w = document.getElementById('mail-when'), so = document.getElementById('mail-sobre');
  if(w.hidden){
    w.hidden = false; so.hidden = false;
    w.min = new Date(ahoraSrv() + 86400000).toISOString().slice(0, 10);
    document.getElementById('mail-when-btn').setAttribute('aria-expanded', 'true');
    try{ w.focus(); }catch(e){}
  }else{
    w.hidden = true; so.hidden = true; w.value = ''; so.value = '';
    document.getElementById('mail-when-btn').setAttribute('aria-expanded', 'false');
  }
  applyMailLang(); guardarBorrador(true);
});

});
