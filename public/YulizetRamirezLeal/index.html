function randomBetween(min,max){ return min + Math.random() * (max - min); }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function pickRandom(list){
  return list[Math.floor(Math.random() * list.length)];
}
function pickWeightedType(pool){
  const total = pool.reduce((sum, item) => sum + item.weight, 0);
  let roll = Math.random() * total;
  for(const item of pool){
    roll -= item.weight;
    if(roll <= 0) return item.type;
  }
  return pool[0]?.type || 'cat';
}
function chooseWeightedPetType(){
  return pickWeightedType(PET_SPECIES_WEIGHTS);
}
function chooseVariant(species){
  const pool = PET_VARIANTS[species] || PET_VARIANTS.cat;
  return pickRandom(pool);
}
function petLocale(){
  return PET_SPEECH[LANG] || PET_SPEECH.es;
}
function choosePetName(species){
  const pool = PET_NAMES[species] || PET_NAMES.cat;
  return pickRandom(pool);
}
function choosePetPersonality(species, key){
  const localeMap = PET_PERSONALITIES[LANG] || PET_PERSONALITIES.es;
  const pool = localeMap[key || species] || localeMap[species] || localeMap.cat;
  return pickRandom(pool);
}
function resolvePetBubbleText(pet, kind, meta){
  const locale = petLocale();
  switch(kind){
    case 'intro':
      return locale.intro(pet);
    case 'click':
      return locale.click(pet);
    case 'catchBall':
      return locale.catchBall(pet);
    case 'social':
      return locale.social(pet, meta);
    case 'friend':
      return locale.friend(pet, meta || 0);
    default:
      return typeof meta === 'string' ? meta : pet.bubbleText;
  }
}
function refreshPetLocaleData(){
  PET_STAGE_STATE.pets.forEach(pet => {
    pet.personality = choosePetPersonality(pet.species, pet.personalityKey);
    if(pet.bubble.classList.contains('show') && pet.bubbleKind){
      const text = resolvePetBubbleText(pet, pet.bubbleKind, pet.bubbleMeta);
      pet.bubbleText = text;
      pet.bubble.textContent = text;
    }
  });
}

function paintSprite(ctx2, x, y, w, h, color){
  ctx2.fillStyle = color;
  ctx2.fillRect(x, y, w, h);
}

function drawCatSprite(ctx2, state, frame, palette){
  if(state === 'peek'){
    paintSprite(ctx2, 3, 11, 4, 2, palette.dark);
    paintSprite(ctx2, 9, 11, 4, 2, palette.dark);
    paintSprite(ctx2, 2, 6, 12, 5, palette.fur);
    paintSprite(ctx2, 3, 7, 10, 3, palette.light);
    paintSprite(ctx2, 4, 3, 2, 4, palette.fur);
    paintSprite(ctx2, 10, 3, 2, 4, palette.fur);
    paintSprite(ctx2, 5, 6, 1, 1, palette.eye || '#c8ef7a');
    paintSprite(ctx2, 10, 6, 1, 1, palette.eye || '#c8ef7a');
    paintSprite(ctx2, 7, 8, 2, 1, palette.nose || palette.accent);
    if(palette.tabby){
      paintSprite(ctx2, 6, 4, 1, 2, palette.dark);
      paintSprite(ctx2, 8, 4, 1, 2, palette.dark);
    }
    return;
  }
  const sleeping = state === 'sleep';
  const bob = state === 'run' ? 0 : (frame % 2);
  const leg = (state === 'lie' || sleeping || state === 'stretch') ? 0 : frame % 2;
  paintSprite(ctx2, 2, 9 + bob, 2, 1, palette.dark);
  paintSprite(ctx2, 1, 8 + bob, 1, 2, palette.dark);
  paintSprite(ctx2, 4, 7 + bob, 7, 4, palette.fur);
  paintSprite(ctx2, 5, 8 + bob, 5, 2, palette.light);
  paintSprite(ctx2, 10, 4 + bob, 4, 4, palette.fur);
  paintSprite(ctx2, 10, 3 + bob, 1, 1, palette.dark);
  paintSprite(ctx2, 13, 3 + bob, 1, 1, palette.dark);
  paintSprite(ctx2, 11, 5 + bob, 2, 2, palette.light);
  if(sleeping){
    paintSprite(ctx2, 11, 5 + bob, 3, 1, palette.dark);
  }else{
    paintSprite(ctx2, 11, 5 + bob, 1, 1, palette.eye || '#c8ef7a');
    paintSprite(ctx2, 13, 5 + bob, 1, 1, palette.eye || '#c8ef7a');
  }
  paintSprite(ctx2, 12, 6 + bob, 1, 1, palette.nose || palette.accent);
  if(palette.tabby){
    paintSprite(ctx2, 6, 7 + bob, 1, 3, palette.dark);
    paintSprite(ctx2, 8, 7 + bob, 1, 3, palette.dark);
    paintSprite(ctx2, 5, 5 + bob, 1, 1, palette.dark);
    paintSprite(ctx2, 9, 5 + bob, 1, 1, palette.dark);
  }
  if(state === 'lie' || sleeping){
    paintSprite(ctx2, 4, 10, 9, 2, palette.fur);
    paintSprite(ctx2, 12, 8, 3, 3, palette.fur);
    if(sleeping) paintSprite(ctx2, 14, 4, 1, 1, palette.accent);
  }else{
    paintSprite(ctx2, 5, 11, 1, 2 - leg, palette.dark);
    paintSprite(ctx2, 8, 11, 1, 2, palette.dark);
    paintSprite(ctx2, 9, 11, 1, 2 - (1-leg), palette.dark);
  }
}

function drawDogSprite(ctx2, state, frame, palette){
  const bob = state === 'run' ? 0 : (frame % 2);
  const leg = frame % 2;
  paintSprite(ctx2, 2, 8 + bob, 2, 2, palette.dark);
  paintSprite(ctx2, 1, 7 + bob, 1, 3, palette.dark);
  paintSprite(ctx2, 4, 7 + bob, 7, 4, palette.fur);
  paintSprite(ctx2, 11, 5 + bob, 4, 4, palette.fur);
  paintSprite(ctx2, 14, 6 + bob, 2, 2, palette.light);
  paintSprite(ctx2, 12, 4 + bob, 1, 2, palette.dark);
  paintSprite(ctx2, 10, 4 + bob, 1, 3, palette.dark);
  paintSprite(ctx2, 12, 6 + bob, 1, 1, '#1d1718');
  paintSprite(ctx2, 14, 6 + bob, 1, 1, '#1d1718');
  if(state === 'lie'){
    paintSprite(ctx2, 4, 10, 10, 2, palette.fur);
  }else{
    paintSprite(ctx2, 5, 11, 1, 2 - leg, palette.dark);
    paintSprite(ctx2, 8, 11, 1, 2, palette.dark);
    paintSprite(ctx2, 10, 11, 1, 2 - (1-leg), palette.dark);
  }
}

function drawBunnySprite(ctx2, state, frame, palette){
  const sleeping = state === 'sleep';
  const bob = state === 'run' ? 0 : (frame % 2);
  const leg = frame % 2;
  paintSprite(ctx2, 4, 7 + bob, 7, 4, palette.fur);
  paintSprite(ctx2, 10, 4 + bob, 4, 4, palette.fur);
  paintSprite(ctx2, 10, 1 + bob, 1, 4, palette.fur);
  paintSprite(ctx2, 13, 1 + bob, 1, 4, palette.fur);
  paintSprite(ctx2, 10, 2 + bob, 1, 2, palette.accent);
  paintSprite(ctx2, 13, 2 + bob, 1, 2, palette.accent);
  if(sleeping){
    paintSprite(ctx2, 11, 6 + bob, 3, 1, palette.dark);
  }else{
    paintSprite(ctx2, 11, 6 + bob, 1, 1, palette.eye || '#1d1718');
    paintSprite(ctx2, 13, 6 + bob, 1, 1, palette.eye || '#1d1718');
  }
  paintSprite(ctx2, 12, 7 + bob, 1, 1, palette.accent);
  if(state === 'lie' || sleeping){
    paintSprite(ctx2, 4, 10, 9, 2, palette.fur);
  }else{
    paintSprite(ctx2, 5, 11, 1, 2 - leg, palette.dark);
    paintSprite(ctx2, 8, 11, 1, 2, palette.dark);
    paintSprite(ctx2, 10, 11, 1, 2 - (1-leg), palette.dark);
  }
}

function drawChickenSprite(ctx2, state, frame, palette){
  const bob = state === 'run' ? 0 : frame % 2;
  paintSprite(ctx2, 4, 6 + bob, 6, 5, palette.fur);
  paintSprite(ctx2, 9, 4 + bob, 3, 3, palette.fur);
  paintSprite(ctx2, 11, 5 + bob, 2, 1, '#f1b243');
  paintSprite(ctx2, 9, 3 + bob, 2, 1, palette.accent);
  paintSprite(ctx2, 7, 4 + bob, 1, 2, palette.accent);
  paintSprite(ctx2, 9, 5 + bob, 1, 1, '#1d1718');
  if(state === 'peck') paintSprite(ctx2, 11, 6 + bob, 3, 1, '#f1b243');
  paintSprite(ctx2, 5, 11, 1, 2 - (frame % 2), '#b76f27');
  paintSprite(ctx2, 8, 11, 1, 2, '#b76f27');
}

function buildPetSprite(species, state, frame, palette, block){
  const key = [
    species,
    state,
    frame,
    block,
    palette.fur,
    palette.dark,
    palette.light,
    palette.accent,
    palette.eye || '',
    palette.nose || '',
    palette.tabby ? 'tabby' : 'plain',
  ].join(':');
  if(PET_SPRITE_CACHE.has(key)) return PET_SPRITE_CACHE.get(key);
  const off = document.createElement('canvas');
  off.width = SPRITE_GRID * block;
  off.height = SPRITE_GRID * block;
  const ctx2 = off.getContext('2d');
  ctx2.imageSmoothingEnabled = false;
  // Escala entera: las funciones de dibujo siguen usando la rejilla 16×16.
  ctx2.setTransform(block, 0, 0, block, 0, 0);
  switch(species){
    case 'dog': drawDogSprite(ctx2, state, frame, palette); break;
    case 'bunny': drawBunnySprite(ctx2, state, frame, palette); break;
    case 'chicken': drawChickenSprite(ctx2, state, frame, palette); break;
    case 'cat':
    default: drawCatSprite(ctx2, state, frame, palette); break;
  }
  const url = off.toDataURL('image/png');
  PET_SPRITE_CACHE.set(key, url);
  return url;
}

function chooseDiverseSpecies(existingPets){
  const counts = existingPets.reduce((map, pet) => {
    map[pet.species] = (map[pet.species] || 0) + 1;
    return map;
  }, {});
  const nonCats = PET_SPECIES_WEIGHTS.filter(item => item.type !== 'cat');
  const missingNonCats = nonCats.filter(item => !counts[item.type]);
  if(existingPets.length >= 1 && missingNonCats.length && existingPets.length <= 3){
    return pickWeightedType(missingNonCats);
  }
  const catCount = counts.cat || 0;
  const totalPets = existingPets.length;
  if(totalPets >= 2 && catCount / Math.max(totalPets, 1) >= 0.5 && Math.random() < 0.82){
    return pickWeightedType(nonCats);
  }
  return chooseWeightedPetType();
}

function createStagePet(options = {}){
  const profile = options.special ? SPECIAL_BY_KEY[options.special] : null;
  const species = profile ? profile.species : chooseDiverseSpecies(PET_STAGE_STATE.pets);
  const cfg = PET_LIBRARY[species] || PET_LIBRARY.cat;
  const size = snapPetSize(cfg.size + Math.round(randomBetween(-4, 6)));
  const el = document.createElement('img');
  el.className = 'pet-sprite';
  el.alt = '';
  const bubble = document.createElement('div');
  bubble.className = 'pet-bubble';
  PET_PLAYGROUND_EL.appendChild(el);
  PET_PLAYGROUND_EL.appendChild(bubble);
  const pet = {
    el,
    bubble,
    species,
    name:profile ? profile.name : choosePetName(species),
    personalityKey:profile ? profile.key : species,
    personality:choosePetPersonality(species, profile ? profile.key : species),
    palette:profile ? profile.palette : chooseVariant(species),
    size,
    block:petBlockFor(size),
    floor:14 + Math.round(randomBetween(0, 10)),
    x:randomBetween(18, Math.max(28, LEFT.clientWidth - 80)),
    facing:Math.random() < 0.5 ? -1 : 1,
    speed:cfg.speed * randomBetween(0.85, 1.2),
    state:'idle',
    stateTimer:randomBetween(0.8, 1.6),
    frameTimer:0,
    phase:Math.random() * TAU,
    focus:'wander',
    bubbleTimer:0,
    bubbleText:'',
    bubbleKind:'',
    bubbleMeta:null,
    buddyId:'',
    id:crypto.randomUUID(),
    socialCooldown:randomBetween(0.8, 1.7),
    special:options.special || '',
  };
  el.dataset.petId = pet.id;
  el.addEventListener('pointerdown', event => {
    event.stopPropagation();
  });
  el.addEventListener('pointerenter', event => {
    event.stopPropagation();
    showPetBubble(pet, '', 1.4, 'intro');
  });
  el.addEventListener('click', event => {
    event.stopPropagation();
    showPetBubble(pet, '', 1.6, 'click');
    pet.focus = 'ball';
    pet.state = pet.species === 'chicken' ? 'walk' : 'run';
    pet.stateTimer = randomBetween(0.7, 1.3);
  });
  return pet;
}

function syncPetPopulation(){
  while(PET_STAGE_STATE.pets.length > S.petCount){
    const pet = PET_STAGE_STATE.pets.pop();
    pet.el.remove();
    pet.bubble.remove();
  }
  SPECIAL_PETS.forEach((profile, i) => {
    if(S.petCount > i && !PET_STAGE_STATE.pets.some(p => p.special === profile.key)){
      PET_STAGE_STATE.pets.splice(i, 0, createStagePet({ special:profile.key }));
    }
  });
  while(PET_STAGE_STATE.pets.length > S.petCount){
    const pet = PET_STAGE_STATE.pets.pop();
    pet.el.remove();
    pet.bubble.remove();
  }
  while(PET_STAGE_STATE.pets.length < S.petCount){
    PET_STAGE_STATE.pets.push(createStagePet());
  }
  PET_STAGE_EL.classList.toggle('active', S.petCount > 0);
}

function showPetBubble(pet, text, duration, kind = 'custom', meta = null){
  const resolvedText = kind === 'custom' ? text : resolvePetBubbleText(pet, kind, meta);
  pet.bubbleKind = kind;
  pet.bubbleMeta = meta;
  pet.bubbleText = text;
  pet.bubbleTimer = duration;
  pet.bubble.textContent = resolvedText;
  pet.bubbleText = resolvedText;
  pet.bubble.classList.add('show');
}

function hidePetBubble(pet){
  pet.bubbleTimer = 0;
  pet.bubbleKind = '';
  pet.bubbleMeta = null;
  pet.bubble.classList.remove('show');
}

function chooseNextStateFromGraph(species, current){
  const graph = PET_BEHAVIOR_GRAPH[species] || PET_BEHAVIOR_GRAPH.cat;
  const next = graph[current] || graph.idle || ['idle'];
  return next[Math.floor(Math.random() * next.length)];
}

function choosePetState(pet, width){
  const ballDx = PET_STAGE_STATE.ballX - pet.x;
  const nearBall = Math.abs(ballDx) < width * 0.28;
  if(nearBall && PET_STAGE_STATE.ballCooldown <= 0 && Math.random() < 0.76){
    pet.focus = 'ball';
    pet.state = Math.abs(ballDx) < 34 ? (pet.species === 'chicken' ? 'peck' : 'idle') : 'run';
    pet.stateTimer = randomBetween(0.45, 1.1);
    return;
  }
  pet.focus = 'wander';
  pet.state = chooseNextStateFromGraph(pet.species, pet.state);
  pet.stateTimer =
    pet.state === 'lie' ? randomBetween(1.3, 2.4) :
    pet.state === 'stand' ? randomBetween(0.7, 1.3) :
    pet.state === 'idle' ? randomBetween(0.45, 1.1) :
    randomBetween(0.7, 1.7);
  if(Math.random() < 0.56) pet.facing *= -1;
}

function resetPetBall(width){
  PET_STAGE_STATE.ballX = clamp(width * randomBetween(0.26, 0.74), 24, width - 24);
  PET_STAGE_STATE.ballY = 46 + randomBetween(0, 22);
  PET_STAGE_STATE.ballVX = (Math.random() < 0.5 ? -1 : 1) * randomBetween(86, 148);
  PET_STAGE_STATE.ballVY = randomBetween(112, 162);
  PET_STAGE_STATE.ballCooldown = randomBetween(0.8, 1.5);
}

function updatePetBall(dt, width){
  const floor = 20;
  const gravity = 420;
  PET_STAGE_STATE.ballCooldown -= dt;
  PET_STAGE_STATE.ballVY -= gravity * dt;
  PET_STAGE_STATE.ballX += PET_STAGE_STATE.ballVX * dt;
  PET_STAGE_STATE.ballY += PET_STAGE_STATE.ballVY * dt;
  if(PET_STAGE_STATE.ballX <= 8 || PET_STAGE_STATE.ballX >= width - 22){
    PET_STAGE_STATE.ballX = clamp(PET_STAGE_STATE.ballX, 8, width - 22);
    PET_STAGE_STATE.ballVX *= -1;
  }
  if(PET_STAGE_STATE.ballY <= floor){
    PET_STAGE_STATE.ballY = floor;
    PET_STAGE_STATE.ballVY = Math.abs(PET_STAGE_STATE.ballVY) * randomBetween(0.58, 0.72);
    if(PET_STAGE_STATE.ballVY < 48){
      resetPetBall(width);
    }
  }
  PET_BALL_EL.style.left = `${PET_STAGE_STATE.ballX}px`;
  PET_BALL_EL.style.bottom = `${PET_STAGE_STATE.ballY}px`;
  PET_BALL_EL.style.transform = `translate3d(0,0,0) scale(${0.92 + Math.min(0.14, Math.abs(PET_STAGE_STATE.ballVY)/900)})`;
}

function updatePetFriendships(dt){
  PET_STAGE_STATE.friendshipTimer -= dt;
  if(PET_STAGE_STATE.friendshipTimer > 0 || PET_STAGE_STATE.pets.length < 2) return;
  PET_STAGE_STATE.friendshipTimer = randomBetween(2.8, 5.2);
  if(Math.random() > 0.42) return;
  const pets = [...PET_STAGE_STATE.pets].sort(() => Math.random() - 0.5);
  const a = pets[0];
  const b = pets[1];
  if(!a || !b) return;
  a.buddyId = b.id;
  b.buddyId = a.id;
  a.focus = 'friend';
  b.focus = 'friend';
  a.state = 'run';
  b.state = 'run';
  a.stateTimer = randomBetween(0.9, 1.6);
  b.stateTimer = randomBetween(0.9, 1.6);
  showPetBubble(a, '', 0.9, 'friend', 0);
  showPetBubble(b, '', 0.9, 'friend', 1);
}

function updatePetCollisions(dt, width){
  for(const pet of PET_STAGE_STATE.pets){
    pet.socialCooldown = Math.max(0, pet.socialCooldown - dt);
  }
  for(let i=0; i<PET_STAGE_STATE.pets.length; i++){
    for(let j=i+1; j<PET_STAGE_STATE.pets.length; j++){
      const a = PET_STAGE_STATE.pets[i];
      const b = PET_STAGE_STATE.pets[j];
      const ax = a.x + a.size * 0.5;
      const bx = b.x + b.size * 0.5;
      const overlap = (a.size * 0.48 + b.size * 0.48) - Math.abs(ax - bx);
      if(overlap <= 0) continue;
      if(ax <= bx){
        a.facing = -1;
        b.facing = 1;
      }else{
        a.facing = 1;
        b.facing = -1;
      }
      if(a.socialCooldown <= 0 && b.socialCooldown <= 0 && Math.random() < 0.16){
        showPetBubble(a, '', 0.7, 'social');
        showPetBubble(b, '', 0.7, 'social');
        a.socialCooldown = b.socialCooldown = randomBetween(1.8, 3.1);
      }
    }
  }
}

function throwPetBallTo(clientX, clientY){
  const rect = PET_STAGE_EL.getBoundingClientRect();
  const x = clamp(clientX - rect.left, 10, rect.width - 22);
  const y = clamp(rect.height - (clientY - rect.top), 28, rect.height * 0.52);
  PET_STAGE_STATE.ballX = x;
  PET_STAGE_STATE.ballY = y;
  PET_STAGE_STATE.ballVX = (Math.random() < 0.5 ? -1 : 1) * randomBetween(92, 164);
  PET_STAGE_STATE.ballVY = randomBetween(118, 188);
  PET_STAGE_STATE.ballCooldown = randomBetween(0.38, 0.82);
  PET_STAGE_STATE.pets.forEach(pet => {
    pet.focus = 'ball';
    pet.state = pet.species === 'chicken' ? 'walk' : 'run';
    pet.stateTimer = randomBetween(0.55, 1.05);
  });
}

function updateStagePet(pet, dt, width){
  if(pet.bubbleTimer > 0){
    pet.bubbleTimer -= dt;
    if(pet.bubbleTimer <= 0) hidePetBubble(pet);
  }
  pet.stateTimer -= dt;
  if(pet.stateTimer <= 0) choosePetState(pet, width);

  const minX = 10;
  const maxX = Math.max(minX, width - pet.size - 10);
  const speedMult = pet.state === 'run' ? 1.7 : pet.state === 'walk' ? 0.9 : 0;
  if(speedMult > 0){
    if(pet.focus === 'ball'){
      pet.facing = PET_STAGE_STATE.ballX >= pet.x ? 1 : -1;
    }else if(pet.focus === 'friend' && pet.buddyId){
      const buddy = PET_STAGE_STATE.pets.find(other => other.id === pet.buddyId);
      if(buddy){
        pet.facing = buddy.x >= pet.x ? 1 : -1;
      }else{
        pet.focus = 'wander';
        pet.buddyId = '';
      }
    }
    pet.x += pet.facing * pet.speed * speedMult * dt;
  }
  if(pet.x <= minX){ pet.x = minX; pet.facing = 1; pet.focus = 'wander'; }
  if(pet.x >= maxX){ pet.x = maxX; pet.facing = -1; pet.focus = 'wander'; }

  if(pet.focus === 'ball'){
    const distBall = Math.abs((pet.x + pet.size*0.5) - PET_STAGE_STATE.ballX);
    if(distBall < pet.size * 0.28 && PET_STAGE_STATE.ballY < pet.floor + pet.size * 0.55){
      pet.state = pet.species === 'chicken' ? 'peck' : 'idle';
      pet.stateTimer = randomBetween(0.32, 0.7);
      PET_STAGE_STATE.ballVX = pet.facing * randomBetween(118, 176);
      PET_STAGE_STATE.ballVY = randomBetween(136, 192);
      PET_STAGE_STATE.ballCooldown = randomBetween(0.45, 0.95);
      showPetBubble(pet, '', 0.65, 'catchBall');
      pet.focus = 'wander';
    }
  }

  pet.frameTimer += dt * (pet.state === 'run' ? 10 : pet.state === 'walk' ? 7 : 3);
  const frameCount = (pet.state === 'lie' || pet.state === 'stand' || pet.state === 'peck') ? 1 : 2;
  const frame = Math.floor(pet.frameTimer) % frameCount;
  const bob = pet.state === 'run'
    ? Math.abs(Math.sin(S.t * 12 + pet.phase)) * 4
    : pet.state === 'walk'
      ? Math.abs(Math.sin(S.t * 8 + pet.phase)) * 2
      : Math.abs(Math.sin(S.t * 3 + pet.phase)) * 0.75;
  const spriteState = pet.state === 'stand' ? 'idle' : pet.state;
  pet.el.src = buildPetSprite(pet.species, spriteState, frame, pet.palette, pet.block);
  pet.el.style.width = `${pet.size}px`;
  pet.el.style.height = `${pet.size}px`;
  pet.el.style.left = `${snapDevice(pet.x)}px`;
  pet.el.style.bottom = `${snapDevice(pet.floor + bob)}px`;
  pet.el.style.transform = `translate3d(0,0,0) scaleX(${pet.facing})`;
  pet.el.style.zIndex = String(10 + Math.round(pet.floor + bob));
  pet.bubble.style.left = `${pet.x + pet.size * 0.1}px`;
  pet.bubble.style.bottom = `${pet.floor + pet.size + 12}px`;
  pet.bubble.style.zIndex = String(40 + Math.round(pet.floor + bob));
}

function updatePetStage(dt){
  syncPetPopulation();
  if(S.petCount <= 0) return;
  const width = LEFT.clientWidth;
  if(PET_STAGE_STATE.ballX <= 0) resetPetBall(width);
  updatePetBall(dt, width);
  updatePetFriendships(dt);
  PET_STAGE_STATE.pets.forEach(pet => updateStagePet(pet, dt, width));
  updatePetCollisions(dt, width);
}

// ═══════════════════════════════════════════════════════
//  MAIN RENDER  — uses CW / CH throughout
// ═══════════════════════════════════════════════════════
function render(){
  const th    = getTheme();
  const handX = CW * 0.5;
  const handY = CH * 0.97;

  drawBg(th);
  drawBgMath(th);
  drawParticles(th);

  const configs   = BOUQUET[Math.min(S.n, 7)];
  const baseScale = Math.min(CW, CH) * 0.12;
  const sorted    = [...configs.map((c,i)=>({...c,i}))].sort((a,b)=>a.sc-b.sc);

  for(const cfg of sorted){
    const rx = handX + cfg.dx*CW,  ry = handY + cfg.dy*CH;
    const fx = handX + cfg.dx*CW*0.1, fy = handY - CH*0.012;
    drawStem(cfg.i, fx,fy, rx,ry, th);
    const frac = 0.36 + (cfg.i%3)*0.08;
    const lx = fx+(rx-fx)*frac, ly = fy+(ry-fy)*frac;
    const sa = Math.atan2(ry-fy, rx-fx);
    const lsz= 14*cfg.sc;
    drawLeaf(lx,ly, sa+0.72, lsz, th);
    drawLeaf(lx,ly, sa-0.65, lsz, th);
  }
  for(const cfg of sorted){
    const rx = handX + cfg.dx*CW, ry = handY + cfg.dy*CH;
    drawRoseHead(rx, ry, baseScale*cfg.sc, cfg.p, S.blooms[cfg.i]??0, th);
  }
  drawPets(th);
  if(S.epicycles) drawEpicycles(th);

  const vg = ctx.createRadialGradient(handX,handY,0, handX,handY,CW*0.12);
  vg.addColorStop(0,th.mid+'14'); vg.addColorStop(1,'transparent');
  ctx.fillStyle=vg; ctx.fillRect(0,0,CW,CH);
}

// ═══════════════════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════════════════
let lastTs = 0;
function loop(ts){
  const dt = Math.min((ts-lastTs)/1000, 0.05);
  lastTs = ts;
  S.t += dt * S.speed;
  updateBlooms(dt);
  updatePetStage(dt);
  render();
  requestAnimationFrame(loop);
}

let editor, debounceTimer;

function compileUserCode(code){
  try{
    const fn = new Function('theta','A','k','t','phi', code);
    const v  = fn(0, 1, 3, 0, 0);
    // Accept numbers (including NaN — lemniscata returns NaN for some θ)
    // and [x,y] arrays. Reject undefined, null, objects, etc.
    const ok = (typeof v==='number') || Array.isArray(v);
    if(!ok) throw new Error(
      LANG==='es' ? 'La función debe retornar número o [x,y]' :
                   'Function must return a number or [x,y]'
    );
    S.userFn=fn; S.userErr=false;
    document.getElementById('code-status').textContent = t('valid');
    document.getElementById('code-status').className   = 'code-status';
    const errOk = document.getElementById('code-err');
    errOk.classList.remove('show');
    errOk.textContent = '';
    markDirtyDFT(); resetBlooms();
    return true;
  }catch(e){
    S.userErr=true;
    document.getElementById('code-status').textContent = t('error_lbl');
    document.getElementById('code-status').className   = 'code-status err';
    const errEl = document.getElementById('code-err');
    errEl.textContent = '⚠ ' + e.message;
    errEl.classList.add('show');
    return false;
  }
}

function initEditor(initialCode){
  if(editor){
    editor.setValue(initialCode);
    compileUserCode(initialCode);
    return;
  }
  editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
    mode:'javascript', theme:'material-darker',
    lineNumbers:true, indentUnit:2, tabSize:2,
    lineWrapping:true, autofocus:false,
  });
  editor.setValue(initialCode);
  compileUserCode(initialCode);
  editor.on('change', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => compileUserCode(editor.getValue()), 350);
  });
}

    box.appendChild(txt);
    if(p && p.src){
      p.src.forEach(s => {
        const a = document.createElement('a');
        a.className = 'ins-src';

        a.target = '_blank';

        a.textContent = '\u2197 ' + s.n;

  box.style.opacity = '0';
  box._fade = setTimeout(paint, 180);
}

// ═══════════════════════════════════════════════════════
//  GLIFOS  — cada chip dibuja su propia curva, muestreada
//  de su propia formula. stroke:currentColor => sobrevive a
//  los 3 modos de color sin una sola regla nueva.
// ═══════════════════════════════════════════════════════
const GLYPHS = new Map();
const GLYPH_VB = 1.15;   // medio viewBox; deja aire para el grosor del trazo

function glyphPath(p){
  if(GLYPHS.has(p.id)) return GLYPHS.get(p.id);
  let out = null;
  try{
    const f = new Function('theta','A','k','t','phi', p.code);
    // k=3 es el valor con el que arrancan los sliders: el glifo predice
    // lo que el lienzo va a dibujar de verdad al pulsar el chip.
    const gk = p.glyphK ?? 3;
    const [t0,tEnd] = p.tRange;
    const t1 = t0 + (tEnd - t0) * (p.glyphSpan ?? 1);
    const N  = p.glyphN ?? Math.min(p.steps ?? 1800, p.discrete ? 90 : 150);
    const pts = [];
    const sample = th => {
      let v;
      try{ v = f(th, 1, gk, 0, 0); }catch(e){ return; }
      let x, y;
      if(Array.isArray(v)){ x = v[0]; y = v[1]; }
      else if(typeof v === 'number' && isFinite(v)){ x = v*Math.cos(th); y = v*Math.sin(th); }
      else return;
      if(isFinite(x) && isFinite(y)) pts.push([x, y]);
    };
    if(p.discrete){
      const step = Math.max(1, Math.ceil(361/N));
      for(let i=0; i<=360; i+=step) sample(i*(tEnd-t0)/360 + t0);
    }else{
      for(let i=0; i<=N; i++) sample(t0 + (i/N)*(t1-t0));
    }
    if(pts.length < 8) return null;
    let maxR = 0;
    for(const [x,y] of pts){ const r = Math.hypot(x,y); if(r > maxR) maxR = r; }
    if(!(maxR > 1e-9)) return null;
    const s = 1/maxR, r2 = v => Math.round(v*100)/100;
    let d = '', len = 0, px = 0, py = 0;
    pts.forEach(([x,y], i) => {
      const nx = x*s, ny = y*s;
      if(i === 0){ d = 'M' + r2(nx) + ' ' + r2(ny); }
      else { d += 'L' + r2(nx) + ' ' + r2(ny); len += Math.hypot(nx-px, ny-py); }
      px = nx; py = ny;
    });
    out = { d, len: Math.round(len*100)/100 };
  }catch(e){ out = null; }
  GLYPHS.set(p.id, out);
  return out;
}

const SVGNS = 'http://www.w3.org/2000/svg';
function makeGlyph(p){
  const g = glyphPath(p);
  if(!g) return null;
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('class', 'pg');
  svg.setAttribute('viewBox', (-GLYPH_VB)+' '+(-GLYPH_VB)+' '+(2*GLYPH_VB)+' '+(2*GLYPH_VB));
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('focusable', 'false');
  svg.style.setProperty('--len', g.len);
  const path = document.createElementNS(SVGNS, 'path');
  path.setAttribute('d', g.d);
  svg.appendChild(path);
  return svg;
}

// ═════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════
//  HERBARIO — flores del libro «Flores 3D» de Debora Pereiro
//  Carbajo (GeoGebra). En el applet original cada flor es una
//  superficie reglada Surface(k*A + (1-k)*a(t)): el centro A
//  unido con una curva de borde a(t). Esa curva de borde ES la
//  flor, y es justo lo que este motor sabe rellenar.
//
//      x = R·f(t)·cos(q·t)     f = modulacion radial
//      y = R·f(t)·sin(q·t)     g = perfil de altura
//      z = Rz·g(t)
//
//  Por eso no guardamos 12 trozos de codigo sino una TABLA de
//  parametros y un evaluador por familia: pesa una decima parte.
// ═══════════════════════════════════════════════════════
// [nombre, familia, p, q, n, k, R, Rz, id de geogebra]
const HERB = [
  ['Rosa',              'sin2n',  1, 1, 3,    0.5,  1.00, 3, 'hprhr6wz'],
  ['Peonía',            'sin2n',  3, 3, 3.3,  0.5,  1.83, 5, 'zrujk74w'],
  ['Manzano',           'sin2n',  1, 2, 3,    0.5,  0.91, 5, 'ju3njy2b'],
  ['Flor silvestre',    'sin2n',  7, 3, 3,    0.5,  1.93, 5, 'utrwxzd7'],
  ['El despertar',      'sin2n',  1, 2, 3,    0.5,  2.25, 5, 'jdbxdjga'],
  ['Margarita',         'cosn',   5, 1, 4.5, -0.2,  2.00, 3, 'peayhujk'],
  ['Magnolia',          'cospow', 3, 1, 0.4,  0,    2.40, 4, 'jautzm5p'],
  ['Flor azul',         'cospow', 3, 5, 2,    0,    2.00, 4, 'pw57c7bv'],
  ['Hortensia',         'hort',   2, 1, 3,    0,    1.00, 3, 'hpkjyfd5'],
  ['Flor Pirineos',     'pirin', 10, 1, 4,    0,    1.00, 3, 'smbvdjzm'],
];

function herbCode(fl){
  const [nom, fam, p, q, n, K, R, Rz] = fl;
  let f, g;
  if(fam === 'sin2n'){
    f = 'Math.cos(' + p + '*u)';
    g = (K*K*K).toFixed(4) + '/(Math.pow(Math.abs(Math.sin(' + p + '*u)),' + (2*n) + ')+' + (K*K).toFixed(4) + ')';
  } else if(fam === 'cosn'){
    f = 'Math.cos(' + p + '*u)';
    g = (K*K*K).toFixed(4) + '/(Math.pow(Math.abs(Math.cos(' + p + '*u)),' + n + ')+' + (K*K).toFixed(4) + ')';
  } else if(fam === 'cospow'){
    f = 'Math.cos(' + p + '*u)';
    g = 'Math.pow(Math.abs(Math.cos(' + p + '*u)),' + n + ')';
  } else if(fam === 'hort'){
    f = '0.2*Math.sin(2*u)';
    g = 'u*u/3';
  } else {
    f = '1/(0.25+Math.sqrt(Math.abs(Math.cos(' + p + '*u))))';
    g = '1.5*u';
  }
  // Normalizacion: cada familia tiene su propio rango. La Hortensia (g=u²/3)
  // y la Flor Pirineos (f con picos de 4) se salian del lienzo con un factor
  // fijo, asi que se mide la funcion real y se escala a partir de ahi.
  const ff = new Function('u', 'return ' + f + ';');
  const gg = new Function('u', 'return ' + g + ';');
  let mf = 0, mg = 0;
  for(let i = 0; i <= 720; i++){
    const u = i * TAU / 720;
    const a = Math.abs(ff(u)), b = Math.abs(gg(u));
    if(isFinite(a) && a > mf) mf = a;
    if(isFinite(b) && b > mg) mg = b;
  }
  if(!(mf > 1e-9)) mf = 1;
  if(!(mg > 1e-9)) mg = 1;
  const kf = (0.88 / mf).toFixed(4);
  const kz = (0.42 / mg).toFixed(4);
  return '// ' + nom + ' — Débora Pereiro Carbajo · GeoGebra\n' +
    '// x = R·f(t)·cos(q·t)   y = R·f(t)·sin(q·t)   z = Rz·g(t)\n' +
    '// (f y g normalizadas: el original vive en otra escala)\n' +
    'const u = theta + phi + t*0.12;\n' +
    'const f = ' + f + ';\n' +
    'const g = ' + g + ';\n' +
    'return [A*' + kf + '*f*Math.cos(' + q + '*u),\n' +
    '        A*' + kf + '*f*Math.sin(' + q + '*u),\n' +
    '        A*' + kz + '*g];';
}

//  BUZÓN DE CARTAS  —  Diego ⇄ Yulizet
//
//  Tres reglas de esta seccion:
//   1. El texto de una carta va SIEMPRE por textContent. Esta pagina
//      ejecuta new Function() con el codigo del editor: cualquier HTML
//      inyectado correria en el mismo contexto que el token.
//   2. Nada se pierde. Borrador y bandeja de salida viven en
//      localStorage y la carta no se borra de ahi hasta que el
//      servidor responde 2xx.
//   3. El candado de fecha lo decide el SERVIDOR. Aqui solo se dibuja
//      la cuenta atras; adelantar el reloj del movil no abre nada.
// ═════════════════════════════════════════════════════
const MAIL_ORIGEN = 'https://appstudiouniversal.com';
// El Worker solo vive en el dominio propio: por pages.dev la API no
// existe y el buzon pareceria roto sin motivo aparente.
if(/\.pages\.dev$/i.test(location.hostname)){
  location.replace(MAIL_ORIGEN + location.pathname + location.search);
}
const MAIL_API = (location.hostname === 'appstudiouniversal.com')
  ? './api/v1'
  : MAIL_ORIGEN + '/YulizetRamirezLeal/api/v1';

const K_TOKEN='jm.mail.token.v1', K_DRAFT='jm.mail.draft.v1', K_LUGAR='jm.mail.lugar.v1',
      K_OUT='jm.mail.outbox.v1', K_CACHE='jm.mail.cache.v1', K_LEIDAS='jm.mail.leidas.v1';

// localStorage LANZA en el Safari privado. Un throw suelto aqui mata
// el requestAnimationFrame(loop) y congela el jardin entero.
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};

const MAIL = {
  token:null, quien:null, otro:null, nombre:null,
  items:[], noLeidas:0, esperando:[], resumen:null, deriva:0,
  fotos:[], urls:[], leida:null, ciudad:null,
  cargando:false, enviando:false, confirmando:false, confTimer:null,
  ultimaCarga:0, foco:null, borrTimer:null,
};

function MailErr(codigo, status, data){
  const e = new Error(codigo); e.codigo = codigo; e.status = status; e.data = data || {};
  return e;
}

// El reloj del servidor manda. Con la deriva medida, la cuenta atras
// no dice «faltan 0 dias» en un movil desajustado para luego dar 423.
const ahoraSrv = () => Date.now() + MAIL.deriva;

function uuid(){
  try{ if(crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0, v = (c === 'x') ? r : ((r & 0x3) | 0x8);
    return v.toString(16);
  });
}

async function mailFetch(ruta, opts){
  opts = opts || {};
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), 20000);
  try{
    const metodo = opts.method || 'GET';
    // ?_=… ademas del no-store: /YulizetRamirezLeal/* iba con una hora
    // de cache y una lista vieja haria mentir al aviso de no leidas
    const url = MAIL_API + ruta +
      (metodo === 'GET' ? (ruta.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now() : '');
    const cab = {};
    if(opts.body && !opts.raw) cab['Content-Type'] = 'application/json';
    if(MAIL.token) cab['Authorization'] = 'Bearer ' + MAIL.token;
    Object.assign(cab, opts.headers || {});

    const r = await fetch(url, { method:metodo, body:opts.body, headers:cab,
                                 signal:ctl.signal, cache:'no-store' });
    // Pages devuelve 200 CON HTML para rutas que no existen: sin esto,
    // una carta perdida pareceria entregada.
    const tipo = r.headers.get('Content-Type') || '';
    if(tipo.indexOf('application/json') < 0) throw MailErr('sin_api', r.status);

    const d = await r.json();
    if(typeof d.server_now === 'number') MAIL.deriva = d.server_now - Date.now();
    if(r.status === 401){ olvidarSesion(); throw MailErr(d.error || 'sin_sesion', 401, d); }
    if(!r.ok) throw MailErr(d.error || 'error', r.status, d);
    return d;
  } finally { clearTimeout(to); }
}

function olvidarSesion(){
  MAIL.token = null; MAIL.quien = null; MAIL.noLeidas = 0;
  store.del(K_TOKEN);
  const w = document.getElementById('mail-wrap');
  if(w && vistaActual() === 'cartas') setMailState('lock');
  syncViewLabels();
  refrescarAviso();
}

// ── fechas ───────────────────────────────────────────────────
function fmtF(ms, o){
  try{ return new Intl.DateTimeFormat(LANG === 'es' ? 'es-MX' : 'en-GB', o).format(new Date(ms)); }
  catch(e){ return new Date(ms).toISOString().slice(0,10); }
}
const fechaLarga = ms => fmtF(ms, {day:'numeric', month:'long', year:'numeric'});
const fechaHora  = ms => fmtF(ms, {day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'});
function fechaCorta(ms){
  const dia = x => { const d = new Date(x); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); };
  const dif = (dia(ahoraSrv()) - dia(ms)) / 86400000;
  if(dif === 0) return t('mail_hoy');
  if(dif === 1) return t('mail_ayer');
  return fmtF(ms, {day:'numeric', month:'short'});
}
function cuentaAtras(abre){
  const dia = ms => { const x = new Date(ms); return Date.UTC(x.getFullYear(), x.getMonth(), x.getDate()); };
  const d = (dia(abre) - dia(ahoraSrv())) / 86400000;
  if(d <= 0) return t('mail_hoy_abre');
  if(d === 1) return t('mail_manana');
  return t('mail_faltan_dias').replace('·', String(d));
}
const nombreDe = q => (q === 'diego' ? 'Diego' : 'Yulizet');

// ── el sello: una rodonea distinta por carta ─────────────────
// makeGlyph cachea por id, asi que en toda la vida de la pagina se
// calculan 7 trazados, no uno por carta.
const WAX_CODE = 'return A*Math.cos(k*theta);';
function hashId(str){
  let h = 0;
  for(let i = 0; i < str.length; i++) h = (h*31 + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function sello(id){
  const k = 3 + (hashId(String(id)) % 7);
  return makeGlyph({ id:'wax'+k, code:WAX_CODE, tRange:[0, Math.PI*2], glyphK:k, glyphN:260 });
}

// ── estados ──────────────────────────────────────────────────
function setMailState(st){
  const w = document.getElementById('mail-wrap');
  if(!w) return;
  w.dataset.state = st;
  const back = document.getElementById('mail-back');
  back.textContent = (st === 'read' || st === 'write') ? t('mail_back_list') : t('mail_back');
  if(st !== 'read') soltarFotos();
  if(st === 'write') stopCarousel();   // recompilar un preset cada 7,5s mientras se escribe es jank puro
  applyMailLang();
  const ti = document.getElementById('mail-title');
  if(ti) { try{ ti.focus({preventScroll:true}); }catch(e){} }
}

function soltarFotos(){
  MAIL.urls.forEach(u => { try{ URL.revokeObjectURL(u); }catch(e){} });
  MAIL.urls = [];
}

function abrirBuzon(){
  if(!MAIL.token){
    setMailState('lock');
    setTimeout(() => { const k = document.getElementById('mail-key'); if(k) k.focus(); }, 80);
    return;
  }
  const w = document.getElementById('mail-wrap');
  if(w.dataset.state === 'lock' || w.dataset.state === 'read') setMailState('list');
  else applyMailLang();
  pintarLista();
  cargarLista();
  procesarSalida();
  try{ history.pushState({buzon:1}, ''); }catch(e){}
}

function volverAtras(){
  const st = document.getElementById('mail-wrap').dataset.state;
  if(st === 'read' || st === 'write'){
    if(st === 'write') guardarBorrador(true);
    setMailState('list'); pintarLista();
    if(MAIL.foco && MAIL.foco.isConnected) { try{ MAIL.foco.focus(); }catch(e){} }
  } else setPanelView('');
}

// ── entrar ───────────────────────────────────────────────────
async function entrar(){
  const inp = document.getElementById('mail-key');
  const st  = document.getElementById('mail-lock-status');
  const clave = (inp.value || '').trim();
  if(!clave) return;
  st.className = 'mail-status'; st.textContent = t('mail_loading');
  try{
    const d = await mailFetch('/sesion', { method:'POST', body: JSON.stringify({ clave }) });
    MAIL.token = d.token; MAIL.quien = d.quien; MAIL.otro = d.otro; MAIL.nombre = d.nombre;
    MAIL.ciudad = d.ciudad || null;
    store.set(K_TOKEN, { token:d.token, quien:d.quien, otro:d.otro, nombre:d.nombre });
    inp.value = ''; st.textContent = '';
    setMailState('list');
    pintarLista(); cargarLista(); procesarSalida();
  }catch(e){
    st.className = 'mail-status err';
    st.textContent = e.status === 429 ? t('mail_lock_wait')
                   : (e.status === 401 || e.status === 400) ? t('mail_lock_err')
                   : t('mail_lock_net');
  }
}

// ── lista ────────────────────────────────────────────────────
// Aviso sin sesión: solo cuántas cartas esperan y a quién. Es la
// única petición que hace la página sin identificarse.
async function refrescarAviso(){
  if(MAIL.token) return;
  try{
    const d = await mailFetch('/aviso');
    MAIL.esperando = d.esperando || [];
    syncViewLabels();
  }catch(e){ /* sin señal: el botón se queda como estaba */ }
}

async function refrescarResumen(){
  if(!MAIL.token) return;
  try{
    const d = await mailFetch('/yo');
    MAIL.quien = d.quien; MAIL.otro = d.otro; MAIL.nombre = d.nombre;
    MAIL.ciudad = d.ciudad || MAIL.ciudad || null;
    MAIL.resumen = d.resumen || {};
    MAIL.noLeidas = MAIL.resumen.no_leidas || 0;
    store.set(K_TOKEN, { token:MAIL.token, quien:MAIL.quien, otro:MAIL.otro, nombre:MAIL.nombre });
    syncViewLabels(); pintarSub();
  }catch(e){ /* sin señal: el buzon se lee igual desde la cache */ }
}

function pintarSub(){
  const sal = document.getElementById('mail-saludo');
  const dir = document.getElementById('mail-dir');
  const est = document.getElementById('mail-stats');
  if(!sal) return;
  if(!MAIL.token){ sal.textContent = ''; dir.textContent = ''; est.textContent = ''; return; }

  const clave = 'mail_saludo_' + (MAIL.quien || '');
  const tabla = I18N[LANG] || I18N.es;
  sal.textContent = (tabla[clave] ? t(clave) : t('mail_saludo')) + (MAIL.nombre || '');

  // «tú eres X, esto le llega a Y» en una frase, sin deducir nada
  dir.textContent = '';
  const otro = nombreDe(MAIL.otro);
  dir.appendChild(document.createTextNode(t('mail_dir_1')));
  const et = document.createElement('span');
  et.className = 'quien'; et.textContent = otro;
  dir.appendChild(et);
  dir.appendChild(document.createTextNode(t('mail_dir_2') + otro + '.'));

  const r = MAIL.resumen || {};
  const rec = r.recibidas || 0, env = r.enviadas || 0;
  let txt = '';
  if(rec || env){
    txt = t('mail_stats') + (rec + env) +
          ' · ' + rec + t('mail_stats_de') + otro +
          ' · ' + env + (env === 1 ? t('mail_stats_mia') : t('mail_stats_mias'));
  }
  if(r.ultimo_acceso) txt += (txt ? '\n' : '') + t('mail_ultimo') + fechaHora(r.ultimo_acceso);
  est.textContent = txt;
}

async function cargarLista(){
  if(MAIL.cargando || !MAIL.token) return;
  MAIL.cargando = true;
  const st = document.getElementById('mail-list-status');
  st.className = 'mail-status';
  st.textContent = MAIL.items.length ? t('mail_refreshing') : t('mail_loading');
  try{
    const d = await mailFetch('/cartas');
    MAIL.items = d.cartas || [];
    store.set(K_CACHE, { items: MAIL.items, ts: Date.now() });
    MAIL.ultimaCarga = Date.now();
    st.textContent = '';
    await refrescarResumen();
  }catch(e){
    st.className = 'mail-status err';
    st.textContent = (navigator.onLine === false) ? t('mail_offline') : t('mail_err');
  }finally{
    MAIL.cargando = false;
    pintarLista();
  }
}

function tarjetaCarta(c){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'mail-card';
  const mia = (c.de === MAIL.quien);
  if(mia) b.classList.add('mia');
  const cera = document.createElement('span');
  cera.className = 'mail-wax mini';
  const gl = sello(c.id); if(gl) cera.appendChild(gl);
  b.appendChild(cera);

  const txt = document.createElement('span'); txt.className = 'mail-card-txt';
  const top = document.createElement('span'); top.className = 'mail-card-top';
  const qui = document.createElement('span');
  const fec = document.createElement('span'); fec.className = 'mail-card-fecha';
  const lin = document.createElement('span'); lin.className = 'mail-card-line';

  qui.textContent = mia ? (t('mail_para') + nombreDe(c.para)) : (t('mail_de') + nombreDe(c.de));

  if(c.sellada){
    b.classList.add('locked');
    b.setAttribute('aria-disabled', 'true');   // NO disabled: perderia el foco y el lector no la anunciaria
    fec.textContent = cuentaAtras(c.abre);
    lin.classList.add('sello');
    lin.textContent = c.sobre || t('mail_sin_sobre');
    b.addEventListener('click', () => {
      const st = document.getElementById('mail-list-status');
      st.className = 'mail-status';
      st.textContent = t('mail_sellada') + ' · ' + fechaLarga(c.abre) + ' · ' + cuentaAtras(c.abre);
    });
  }else{
    if(!mia && !c.abierta_en) b.classList.add('unread');
    // el remitente SI ve su propia carta con fecha futura (la escribio el),
    // pero tiene que quedar claro que la otra persona aun no puede leerla
    fec.textContent = (c.abre > ahoraSrv()) ? cuentaAtras(c.abre) : fechaCorta(c.creada);
    let linea = c.titulo || c.extracto || '';
    if(c.fotos) linea += t('mail_con_fotos');
    lin.textContent = linea;
    b.addEventListener('click', () => abrirCarta(c.id, b));
  }
  top.appendChild(qui); top.appendChild(fec);
  txt.appendChild(top); txt.appendChild(lin);
  b.appendChild(txt);
  return b;
}

function tarjetaSimple(clase, arriba, fecha, linea, onClick, extra){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'mail-card ' + clase;
  const cera = document.createElement('span');
  cera.className = 'mail-wax mini';
  const gl = sello(arriba + fecha); if(gl) cera.appendChild(gl);
  b.appendChild(cera);
  const txt = document.createElement('span'); txt.className = 'mail-card-txt';
  const top = document.createElement('span'); top.className = 'mail-card-top';
  const q = document.createElement('span'); q.textContent = arriba;
  const f = document.createElement('span'); f.className = 'mail-card-fecha'; f.textContent = fecha;
  const l = document.createElement('span'); l.className = 'mail-card-line'; l.textContent = linea;
  top.appendChild(q); top.appendChild(f);
  txt.appendChild(top); txt.appendChild(l);
  if(extra) txt.appendChild(extra);
  b.appendChild(txt);
  if(onClick) b.addEventListener('click', onClick);
  return b;
}

function pintarLista(){
  const cont = document.getElementById('mail-cards');
  if(!cont) return;
  cont.innerHTML = '';        // aqui solo hay tarjetas: ningun <textarea> que destruir
  const frag = document.createDocumentFragment();

  const borr = store.get(K_DRAFT);
  if(borr && borr.cuerpo && borr.cuerpo.trim()){
    frag.appendChild(tarjetaSimple('draft', t('mail_mia'), fechaCorta(borr.ts || Date.now()),
      t('mail_draft'), () => nuevaCarta()));
  }
  (store.get(K_OUT) || []).filter(it => !it.quien || it.quien === MAIL.quien).forEach(it => {
    const linea = it.fallo ? it.fallo : t('mail_queued');
    const extra = document.createElement('span');
    extra.className = 'mail-card-top';
    const r = document.createElement('span'); r.textContent = t('mail_retry');
    extra.appendChild(r);
    frag.appendChild(tarjetaSimple('mia pending', t('mail_mia'), t('mail_sending'),
      linea, () => { delete it.fallo; guardarCola(it); procesarSalida(); }, extra));
  });
  MAIL.items.forEach(c => frag.appendChild(tarjetaCarta(c)));

  if(!frag.childNodes.length){
    const p = document.createElement('p');
    p.className = 'mail-vacio'; p.textContent = t('mail_vacio');
    cont.appendChild(p);
    return;
  }
  cont.appendChild(frag);
}

function guardarCola(item){
  const cola = (store.get(K_OUT) || []).map(x => x.clientId === item.clientId ? item : x);
  store.set(K_OUT, cola);
}

// ── leer ─────────────────────────────────────────────────────
async function abrirCarta(id, foco){
  MAIL.foco = foco || null;
  const st = document.getElementById('mail-list-status');
  st.className = 'mail-status'; st.textContent = t('mail_loading');
  try{
    const d = await mailFetch('/cartas/' + encodeURIComponent(id));
    st.textContent = '';
    guardarLeida(d);
    pintarCarta(d);
    setMailState('read');
    const it = MAIL.items.filter(c => c.id === id)[0];
    if(it && !it.abierta_en && it.para === MAIL.quien){
      it.abierta_en = d.abierta_en;
      MAIL.noLeidas = Math.max(0, MAIL.noLeidas - 1);
      syncViewLabels();
      store.set(K_CACHE, { items: MAIL.items, ts: Date.now() });
    }
  }catch(e){
    // ya leida alguna vez: se puede releer en el metro, sin señal
    const g = (store.get(K_LEIDAS) || {})[id];
    if(g){ pintarCarta(g); setMailState('read'); st.textContent = ''; return; }
    st.className = 'mail-status err';
    if(e.status === 423 && e.data){
      st.textContent = t('mail_sellada') + ' · ' + fechaLarga(e.data.abre) + ' · ' + cuentaAtras(e.data.abre);
    }else{
      st.textContent = (navigator.onLine === false) ? t('mail_offline') : t('mail_err');
    }
  }
}

function guardarLeida(d){
  const g = store.get(K_LEIDAS) || {};
  g[d.id] = { id:d.id, de:d.de, para:d.para, titulo:d.titulo, cuerpo:d.cuerpo,
              lugar:d.lugar, saludo:d.saludo, despedida:d.despedida, firma:d.firma,
              creada:d.creada, abre:d.abre, abierta_en:d.abierta_en, fotos:d.fotos || [] };
  const ids = Object.keys(g);
  if(ids.length > 40) delete g[ids[0]];
  store.set(K_LEIDAS, g);
}

function pintarCarta(d){
  MAIL.leida = d;
  soltarFotos();
  const mia = (d.de === MAIL.quien);
  const wax = document.getElementById('mail-read-wax');
  wax.innerHTML = '';
  const gl = sello(d.id); if(gl) wax.appendChild(gl);

  // la fecha ya no va aquí: ahora está donde va en una carta, arriba
  // a la derecha junto al lugar
  document.getElementById('mail-read-meta').textContent =
    mia ? (t('mail_para') + nombreDe(d.para)) : (t('mail_de') + nombreDe(d.de));

  const lug = document.getElementById('mail-read-lugar');
  lug.textContent = (d.lugar ? d.lugar + ', ' : '') + fechaLarga(d.creada);

  const ti = document.getElementById('mail-read-title');
  ti.textContent = d.titulo || '';
  ti.hidden = !d.titulo;

  const sa = document.getElementById('mail-read-saludo');
  sa.textContent = d.saludo || '';
  sa.hidden = !d.saludo;

  // textContent, nunca innerHTML. .msg-text ya trae white-space:pre-line
  document.getElementById('mail-read-body').textContent = d.cuerpo || '';

  const fc = document.getElementById('mail-read-fotos');
  fc.innerHTML = '';
  (d.fotos || []).forEach(f => {
    const im = document.createElement('img');
    im.alt = ''; im.loading = 'lazy';
    if(f.ancho && f.alto){ im.width = f.ancho; im.height = f.alto; }
    fc.appendChild(im);
    cargarFoto(im, d.id, f.n);
  });

  const de = document.getElementById('mail-read-despedida');
  de.textContent = d.despedida || '';
  de.hidden = !d.despedida;
  const fi = document.getElementById('mail-read-firma');
  fi.textContent = d.firma || '';
  fi.hidden = !d.firma;

  // Se retira solo lo propio y solo mientras no lo haya abierto: en
  // cuanto lo lee, la carta es suya y ya no se puede deshacer.
  const bot = document.getElementById('mail-retirar');
  const puedeRetirar = mia && !d.abierta_en;
  bot.toggleAttribute('hidden', !puedeRetirar);
  MAIL.confirmandoRetiro = false;
  bot.textContent = t('mail_retirar');

  let pie = t('mail_escrita') + fechaHora(d.creada);
  if(d.abre && d.abre > ahoraSrv()) pie += '\n' + t('mail_se_abre') + fechaLarga(d.abre) + ' · ' + cuentaAtras(d.abre);
  if(d.abierta_en) pie += '\n' + t('mail_abierta') + fechaHora(d.abierta_en);
  else if(mia)     pie += '\n' + t('mail_sin_abrir');
  document.getElementById('mail-read-foot').textContent = pie;
}

// El token va en la cabecera, no en la URL: una <img src> con el token
// dentro acabaria en el historial y en cualquier log por el camino.
async function cargarFoto(im, id, n){
  try{
    const r = await fetch(MAIL_API + '/cartas/' + encodeURIComponent(id) + '/fotos/' + n,
      { headers: { Authorization: 'Bearer ' + MAIL.token }, cache: 'no-store' });
    if(!r.ok) throw new Error('foto');
    const b = await r.blob();
    const u = URL.createObjectURL(b);
    MAIL.urls.push(u);
    im.src = u;
  }catch(e){ im.remove(); }
}

// ── escribir ─────────────────────────────────────────────────
function saludoPorDefecto(){
  const k = 'mail_pred_saludo_' + (MAIL.otro || '');
  const tabla = I18N[LANG] || I18N.es;
  return tabla[k] ? t(k) : '';
}

function nuevaCarta(){
  const b = store.get(K_DRAFT) || {};
  document.getElementById('mail-text').value   = b.cuerpo || '';
  document.getElementById('mail-titulo').value = b.titulo || '';
  // El lugar se recuerda del último envío; si es la primera vez, se
  // propone la ciudad que ve Cloudflare. Siempre editable: una carta
  // no puede mentir sobre desde dónde se escribió.
  document.getElementById('mail-lugar').value =
    b.lugar != null ? b.lugar : (store.get(K_LUGAR) || MAIL.ciudad || '');
  document.getElementById('mail-saludo-in').value =
    b.saludo != null ? b.saludo : saludoPorDefecto();
  document.getElementById('mail-despedida').value =
    b.despedida != null ? b.despedida : t('mail_pred_despedida');
  document.getElementById('mail-firma').value =
    b.firma != null ? b.firma : (MAIL.nombre || '');
  const w = document.getElementById('mail-when'), so = document.getElementById('mail-sobre');
  if(b.abre_el){ w.value = b.abre_el; w.hidden = false; so.hidden = false; so.value = b.sobre || ''; }
  else { w.value = ''; w.hidden = true; so.hidden = true; so.value = ''; }
  MAIL.fotos = (b.fotos || []).map(f => ({ id:f.id, ancho:f.ancho, alto:f.alto }));
  pintarThumbs();
  setMailState('write');
  setTimeout(() => { const ta = document.getElementById('mail-text'); if(ta) ta.focus(); }, 80);
}

function limpiarEscritura(){
  document.getElementById('mail-text').value = '';
  document.getElementById('mail-titulo').value = '';
  ['mail-lugar','mail-saludo-in','mail-despedida','mail-firma']
    .forEach(id => { document.getElementById(id).value = ''; });
  const w = document.getElementById('mail-when'), so = document.getElementById('mail-sobre');
  w.value = ''; w.hidden = true; so.value = ''; so.hidden = true;
  MAIL.fotos = []; pintarThumbs(); contarLetras();
  const st = document.getElementById('mail-w-status');
  st.className = 'mail-status'; st.textContent = '';
}

function guardarBorrador(ya){
  clearTimeout(MAIL.borrTimer);
  const hacer = () => {
    const cuerpo = document.getElementById('mail-text').value;
    const titulo = document.getElementById('mail-titulo').value;
    const w = document.getElementById('mail-when');
    if(!cuerpo.trim() && !titulo.trim()){ store.del(K_DRAFT); return; }
    store.set(K_DRAFT, {
      cuerpo, titulo,
      lugar: document.getElementById('mail-lugar').value,
      saludo: document.getElementById('mail-saludo-in').value,
      despedida: document.getElementById('mail-despedida').value,
      firma: document.getElementById('mail-firma').value,
      abre_el: (!w.hidden && w.value) ? w.value : null,
      sobre: document.getElementById('mail-sobre').value,
      fotos: MAIL.fotos.filter(f => f.id).map(f => ({ id:f.id, ancho:f.ancho, alto:f.alto })),
      ts: Date.now(),
    });
  };
  if(ya) hacer(); else MAIL.borrTimer = setTimeout(hacer, 400);
}

function pintarThumbs(){
  const c = document.getElementById('mail-thumbs');
  if(!c) return;
  c.innerHTML = '';
  MAIL.fotos.forEach((f, i) => {
    const d = document.createElement('div');
    d.className = 'mail-thumb' + (f.subiendo ? ' subiendo' : '');
    if(f.url){ const im = document.createElement('img'); im.alt = ''; im.src = f.url; d.appendChild(im); }
    else { d.style.display = 'flex'; d.style.alignItems = 'center'; d.style.justifyContent = 'center';
           d.style.color = 'var(--rose)'; d.textContent = f.error ? '✕' : '❀'; }
    const x = document.createElement('button');
    x.type = 'button'; x.textContent = '✕'; x.setAttribute('aria-label', '✕');
    x.addEventListener('click', ev => {
      ev.stopPropagation();
      if(f.url) { try{ URL.revokeObjectURL(f.url); }catch(e){} }
      MAIL.fotos.splice(i, 1); pintarThumbs(); guardarBorrador(true);
    });
    d.appendChild(x);
    c.appendChild(d);
  });
  const cu = document.getElementById('mail-cuenta');
  if(cu) cu.textContent = MAIL.fotos.length ? MAIL.fotos.length + '/4' : '';
}

// Recomprimir en el movil no es solo por velocidad: pasar la foto por
// un <canvas> borra el EXIF entero, que lleva el GPS de donde se tomo.
async function comprimir(file){
  let img = null, ancho = 0, alto = 0;
  try{
    img = await createImageBitmap(file, { imageOrientation: 'from-image' });
  }catch(e){
    try{ img = await createImageBitmap(file); }
    catch(e2){ img = await cargarImagen(file); }
  }
  ancho = img.naturalWidth || img.width;
  alto  = img.naturalHeight || img.height;
  if(!ancho || !alto) throw new Error('imagen');
  const MAXL = 1600;
  const esc = Math.min(1, MAXL / Math.max(ancho, alto));
  const w = Math.max(1, Math.round(ancho * esc)), h = Math.max(1, Math.round(alto * esc));
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(img, 0, 0, w, h);
  if(img.close) { try{ img.close(); }catch(e){} }
  // webp pesa la mitad que jpeg a igual calidad; jpeg queda de respaldo
  let tipo = 'image/webp';
  try{ if(cv.toDataURL('image/webp').indexOf('data:image/webp') !== 0) tipo = 'image/jpeg'; }
  catch(e){ tipo = 'image/jpeg'; }
  const blob = await new Promise(res => cv.toBlob(res, tipo, tipo === 'image/webp' ? 0.82 : 0.85));
  if(!blob) throw new Error('blob');
  return { blob, tipo, ancho:w, alto:h };
}

function cargarImagen(file){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload  = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); };
    im.src = u;
  });
}

async function elegirFotos(files){
  const st = document.getElementById('mail-w-status');
  for(let i = 0; i < files.length; i++){
    if(MAIL.fotos.length >= 4){
      st.className = 'mail-status err'; st.textContent = t('mail_foto_max');
      break;
    }
    const item = { subiendo:true, url:null, id:null };
    MAIL.fotos.push(item);
    pintarThumbs();
    st.className = 'mail-status'; st.textContent = t('mail_foto_sube');
    try{
      const c = await comprimir(files[i]);
      item.url = URL.createObjectURL(c.blob);
      item.ancho = c.ancho; item.alto = c.alto;
      pintarThumbs();
      const d = await mailFetch('/fotos', { method:'POST', raw:true, body:c.blob,
                                            headers:{ 'Content-Type': c.tipo } });
      item.id = d.id; item.subiendo = false;
      st.textContent = '';
      guardarBorrador(true);
    }catch(e){
      item.subiendo = false; item.error = true;
      st.className = 'mail-status err'; st.textContent = t('mail_foto_err');
    }
    pintarThumbs();
  }
}

// Escribir una carta larga en un textarea de movil es un castigo: se
// escribe donde a uno le apetezca y se sube el archivo.
const MAIL_MAX = 20000;

async function cargarTexto(file){
  const st = document.getElementById('mail-w-status');
  try{
    const buf = await file.arrayBuffer();
    let txt;
    // Un .txt del Bloc de notas de Windows suele venir en cp1252, no en
    // utf-8: sin este respaldo, los acentos salen como jeroglificos.
    try{ txt = new TextDecoder('utf-8', { fatal:true }).decode(buf); }
    catch(e){ txt = new TextDecoder('windows-1252').decode(buf); }
    txt = txt.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');

    const ta = document.getElementById('mail-text');
    const habia = ta.value.trim();
    let nuevo = habia ? (ta.value.replace(/\s+$/, '') + '\n\n' + txt) : txt;
    let aviso = habia ? t('mail_upload_add') : t('mail_upload_ok');
    if(nuevo.length > MAIL_MAX){ nuevo = nuevo.slice(0, MAIL_MAX); aviso = t('mail_upload_cut'); }
    ta.value = nuevo;

    // el nombre del archivo hace de titulo si no habia ninguno
    const ti = document.getElementById('mail-titulo');
    if(!ti.value.trim()){
      const base = String(file.name || '').replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
      if(base && base.length <= 120) ti.value = base;
    }
    st.className = 'mail-status ok'; st.textContent = aviso;
    contarLetras(); guardarBorrador(true);
  }catch(e){
    st.className = 'mail-status err'; st.textContent = t('mail_upload_err');
  }
}

function contarLetras(){
  const c = document.getElementById('mail-chars');
  if(!c) return;
  const n = document.getElementById('mail-text').value.length;
  c.textContent = n ? (n + t('mail_chars')) : '';
  c.style.color = n > MAIL_MAX ? 'var(--err)' : '';
}

// una imagen es una foto, cualquier otra cosa es el texto de la carta
function repartirArchivos(lista){
  const imgs = lista.filter(f => /^image\//.test(f.type));
  const otros = lista.filter(f => !/^image\//.test(f.type));
  if(imgs.length) elegirFotos(imgs);
  if(otros.length) cargarTexto(otros[0]);
}

async function enviar(){
  const btn = document.getElementById('mail-send');
  const st  = document.getElementById('mail-w-status');
  const cuerpo = document.getElementById('mail-text').value.trim();
  if(!cuerpo){ st.className = 'mail-status err'; st.textContent = t('mail_vacia'); return; }
  if(MAIL.fotos.some(f => f.subiendo)){
    st.className = 'mail-status'; st.textContent = t('mail_foto_sube'); return;
  }
  // Dos toques en vez de un confirm(): sellar no tiene vuelta atras.
  if(!MAIL.confirmando){
    MAIL.confirmando = true;
    btn.textContent = t('mail_send_sure');
    clearTimeout(MAIL.confTimer);
    MAIL.confTimer = setTimeout(() => {
      MAIL.confirmando = false; btn.textContent = t('mail_send');
    }, 6000);
    return;
  }
  clearTimeout(MAIL.confTimer);
  MAIL.confirmando = false; btn.textContent = t('mail_send');

  const w = document.getElementById('mail-when');
  const it = {
    clientId: uuid(),
    quien: MAIL.quien,
    cuerpo,
    titulo: document.getElementById('mail-titulo').value.trim() || null,
    lugar: document.getElementById('mail-lugar').value.trim() || null,
    saludo: document.getElementById('mail-saludo-in').value.trim() || null,
    despedida: document.getElementById('mail-despedida').value.trim() || null,
    firma: document.getElementById('mail-firma').value.trim() || null,
    abre_el: (!w.hidden && w.value) ? w.value : null,
    sobre: document.getElementById('mail-sobre').value.trim() || null,
    fotos: MAIL.fotos.filter(f => f.id).map(f => ({ id:f.id, ancho:f.ancho, alto:f.alto })),
    creada: Date.now(),
  };
  // La carta entra en la bandeja de salida ANTES de tocar la red. Si se
  // va la señal o se cierra el navegador, sigue ahi.
  if(it.lugar) store.set(K_LUGAR, it.lugar);   // el próximo lo propone solo
  const cola = store.get(K_OUT) || [];
  cola.push(it);
  store.set(K_OUT, cola);
  store.del(K_DRAFT);
  limpiarEscritura();
  setMailState('list');
  pintarLista();
  procesarSalida();
}

async function procesarSalida(){
  if(MAIL.enviando || !MAIL.token) return;
  let cola = store.get(K_OUT) || [];
  if(!cola.length) return;
  MAIL.enviando = true;
  let cambio = false;
  try{
    for(const it of cola){
      if(it.fallo) continue;
      if(it.quien && it.quien !== MAIL.quien) continue;
      try{
        await mailFetch('/cartas', {
          method:'POST', headers:{ 'Idempotency-Key': it.clientId },
          body: JSON.stringify({ cuerpo:it.cuerpo, titulo:it.titulo,
                                 lugar:it.lugar, saludo:it.saludo,
                                 despedida:it.despedida, firma:it.firma,
                                 abre_el:it.abre_el, sobre:it.sobre, fotos:it.fotos }),
        });
        it.enviada = true; cambio = true;
      }catch(e){
        // 4xx = el servidor la rechaza; reintentar no la va a arreglar.
        // Se marca y se queda en la cola: el texto no se pierde nunca.
        if(e.status && e.status >= 400 && e.status < 500 && e.status !== 429 && e.status !== 408){
          it.fallo = (e.data && e.data.mensaje) || t('mail_err'); cambio = true;
        }
        break;   // sin señal no tiene sentido seguir con las demas
      }
    }
  } finally {
    store.set(K_OUT, cola.filter(x => !x.enviada));
    MAIL.enviando = false;
  }
  if(cambio) await cargarLista(); else pintarLista();
}

// ═════════════════════════════════════════════════════
//  PDF  —  la carta, tal cual se ve, en un archivo
//
//  Se dibuja en un <canvas> y cada pagina se mete en el PDF como
//  imagen. Suena rudo, pero es lo correcto aqui: un PDF con texto
//  de verdad obligaria a incrustar y subdividir las tipografias
//  (Cormorant, Playfair) y aun asi se comeria los emoji, que en una
//  carta de amor van a salir seguro. Asi sale EXACTAMENTE lo que
//  ella ve en pantalla: papel, lacre, fotos y acentos.
// ═════════════════════════════════════════════════════
const PDF_W = 1240, PDF_H = 1754, PDF_M = 108;   // A4 a 150 ppp
const PDF_PAPEL = '#f6eeda', PDF_TINTA = '#2b2016',
      PDF_META = '#8a6b2e', PDF_TITULO = '#1e140a', PDF_PIE = '#6f5c44';
const PDF_F_META   = "500 19px 'JetBrains Mono', monospace";
const PDF_F_TITULO = "italic 44px 'Playfair Display', serif";
const PDF_F_CUERPO = "italic 31px 'Cormorant Garamond', serif";
const PDF_F_PIE    = "17px 'JetBrains Mono', monospace";
const PDF_F_LUGAR  = "italic 27px 'Cormorant Garamond', serif";
const PDF_F_FIRMA  = "38px 'Petit Formal Script', cursive";

async function pdfFuentesListas(){
  if(!document.fonts) return;
  try{
    await Promise.all([PDF_F_META, PDF_F_TITULO, PDF_F_CUERPO, PDF_F_PIE]
      .concat([PDF_F_LUGAR, PDF_F_FIRMA])
      .map(f => document.fonts.load(f, 'Áá')));
    await document.fonts.ready;
  }catch(e){}
}

function pdfEnvolver(med, texto, fuente, ancho){
  med.font = fuente;
  const fuera = [];
  String(texto == null ? '' : texto).split('\n').forEach(par => {
    if(!par.trim()){ fuera.push(null); return; }   // null = renglón en blanco
    let linea = '';
    par.split(/\s+/).forEach(palabra => {
      const prueba = linea ? linea + ' ' + palabra : palabra;
      if(med.measureText(prueba).width > ancho && linea){ fuera.push(linea); linea = palabra; }
      else linea = prueba;
    });
    if(linea) fuera.push(linea);
  });
  return fuera;
}

function pdfLacre(ctx, x, y, r, k){
  const g = ctx.createRadialGradient(x - r*.3, y - r*.35, r*.08, x, y, r);
  g.addColorStop(0, '#f0708f'); g.addColorStop(.42, '#c8365c');
  g.addColorStop(.78, '#8d1f3c'); g.addColorStop(1, '#6d1730');
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = g; ctx.fill();
  // la MISMA rodónea que lleva el sello en pantalla
  ctx.beginPath();
  for(let i = 0; i <= 720; i++){
    const th = i/720 * Math.PI*2, rr = Math.cos(k*th) * r * .58;
    const px = x + rr*Math.cos(th), py = y + rr*Math.sin(th);
    if(i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.strokeStyle = 'rgba(255,228,238,.92)'; ctx.lineWidth = Math.max(1.2, r*.06); ctx.stroke();
}

async function pdfFotosDe(carta){
  const fuera = [];
  for(const f of (carta.fotos || [])){
    try{
      const r = await fetch(MAIL_API + '/cartas/' + encodeURIComponent(carta.id) + '/fotos/' + f.n,
        { headers: { Authorization: 'Bearer ' + MAIL.token }, cache: 'no-store' });
      if(!r.ok) continue;
      const b = await r.blob();
      let img;
      try{ img = await createImageBitmap(b); }catch(e){ img = await cargarImagen(b); }
      fuera.push(img);
    }catch(e){ /* una foto que falla no puede tumbar el PDF entero */ }
  }
  return fuera;
}

function pdfComponer(carta, fotos, med){
  const ANCHO = PDF_W - 2*PDF_M;
  const B = [];
  const mia = (carta.de === MAIL.quien);
  B.push({ tipo:'lacre', alto:104, k: 3 + (hashId(String(carta.id)) % 7),
           meta: (mia ? (t('mail_para') + nombreDe(carta.para))
                      : (t('mail_de') + nombreDe(carta.de))).toUpperCase() });
  // lugar y fecha, arriba a la derecha, como en el papel
  B.push({ tipo:'derecha', texto:(carta.lugar ? carta.lugar + ', ' : '') + fechaLarga(carta.creada),
           alto:56 });
  if(carta.titulo){
    pdfEnvolver(med, carta.titulo, PDF_F_TITULO, ANCHO).forEach(l => {
      if(l) B.push({ tipo:'titulo', texto:l, alto:60 });
    });
    B.push({ tipo:'hueco', alto:18 });
  }
  if(carta.saludo){
    pdfEnvolver(med, carta.saludo, PDF_F_CUERPO, ANCHO).forEach(l => {
      if(l) B.push({ tipo:'linea', texto:l, alto:54 });
    });
    B.push({ tipo:'hueco', alto:16 });
  }
  const cuerpo = carta.sellada ? t('mail_pdf_sellada') + '\n\n' + (carta.sobre || '') : (carta.cuerpo || '');
  pdfEnvolver(med, cuerpo, PDF_F_CUERPO, ANCHO).forEach(l => {
    B.push(l === null ? { tipo:'hueco', alto:28 } : { tipo:'linea', texto:l, alto:54 });
  });
  fotos.forEach(img => {
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    const w = Math.min(ANCHO, iw), h = Math.round(ih * (w/iw));
    B.push({ tipo:'hueco', alto:30 });
    B.push({ tipo:'foto', img, ancho:w, alto:h + 6 });
  });
  if(carta.despedida || carta.firma){
    B.push({ tipo:'hueco', alto:34 });
    if(carta.despedida){
      pdfEnvolver(med, carta.despedida, PDF_F_CUERPO, ANCHO).forEach(l => {
        if(l) B.push({ tipo:'linea', texto:l, alto:52 });
      });
    }
    if(carta.firma) B.push({ tipo:'firma', texto:carta.firma, alto:64 });
  }
  let pie = t('mail_escrita') + fechaHora(carta.creada);
  if(carta.abre && carta.abre > carta.creada) pie += '\n' + t('mail_se_abre') + fechaLarga(carta.abre);
  if(carta.abierta_en) pie += '\n' + t('mail_abierta') + fechaHora(carta.abierta_en);
  B.push({ tipo:'raya', alto:44 });
  pdfEnvolver(med, pie, PDF_F_PIE, ANCHO).forEach(l => {
    if(l) B.push({ tipo:'pie', texto:l, alto:30 });
  });
  return B;
}

function pdfDibujar(ctx, b){
  if(b.tipo === 'lacre'){
    pdfLacre(ctx, PDF_M + 30, b.y + 34, 30, b.k);
    ctx.font = PDF_F_META; ctx.fillStyle = PDF_META; ctx.textBaseline = 'middle';
    ctx.fillText(b.meta, PDF_M + 76, b.y + 36);
    ctx.strokeStyle = 'rgba(90,70,40,.28)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PDF_M, b.y + 86); ctx.lineTo(PDF_W - PDF_M, b.y + 86); ctx.stroke();
    return;
  }
  ctx.textBaseline = 'alphabetic';
  if(b.tipo === 'derecha'){
    ctx.font = PDF_F_LUGAR; ctx.fillStyle = PDF_PIE; ctx.textAlign = 'right';
    ctx.fillText(b.texto, PDF_W - PDF_M, b.y + 34);
    ctx.textAlign = 'left';
    return;
  }
  if(b.tipo === 'firma'){
    ctx.font = PDF_F_FIRMA; ctx.fillStyle = '#7a1a35'; ctx.textAlign = 'right';
    ctx.fillText(b.texto, PDF_W - PDF_M - 40, b.y + 46);
    ctx.textAlign = 'left';
    return;
  }
  if(b.tipo === 'titulo'){ ctx.font = PDF_F_TITULO; ctx.fillStyle = PDF_TITULO; ctx.fillText(b.texto, PDF_M, b.y + 46); }
  else if(b.tipo === 'linea'){ ctx.font = PDF_F_CUERPO; ctx.fillStyle = PDF_TINTA; ctx.fillText(b.texto, PDF_M, b.y + 38); }
  else if(b.tipo === 'pie'){ ctx.font = PDF_F_PIE; ctx.fillStyle = PDF_PIE; ctx.fillText(b.texto, PDF_M, b.y + 20); }
  else if(b.tipo === 'raya'){
    ctx.strokeStyle = 'rgba(90,70,40,.28)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PDF_M, b.y + 22); ctx.lineTo(PDF_W - PDF_M, b.y + 22); ctx.stroke();
  }
  else if(b.tipo === 'foto'){
    ctx.drawImage(b.img, PDF_M, b.y, b.ancho, b.alto - 6);
    ctx.strokeStyle = 'rgba(90,70,40,.3)'; ctx.lineWidth = 1;
    ctx.strokeRect(PDF_M + .5, b.y + .5, b.ancho - 1, b.alto - 7);
  }
}

function pdfFondo(ctx){
  ctx.fillStyle = PDF_PAPEL; ctx.fillRect(0, 0, PDF_W, PDF_H);
  const g = ctx.createRadialGradient(PDF_W/2, -PDF_H*.1, 0, PDF_W/2, PDF_H*.35, PDF_H*.9);
  g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, PDF_W, PDF_H);
  const g2 = ctx.createRadialGradient(PDF_W, PDF_H, 0, PDF_W, PDF_H, PDF_W*.9);
  g2.addColorStop(0, 'rgba(150,110,60,.13)'); g2.addColorStop(1, 'rgba(150,110,60,0)');
  ctx.fillStyle = g2; ctx.fillRect(0, 0, PDF_W, PDF_H);
}

// ── el archivo ───────────────────────────────────────────────
// PDF 1.4 a mano: catálogo, páginas y una imagen JPEG por página.
function pdfArmar(jpegs){
  const trozos = [];
  let largo = 0;
  const crudo = u8 => { trozos.push(u8); largo += u8.length; };
  const texto = str => {
    const a = new Uint8Array(str.length);
    for(let i = 0; i < str.length; i++) a[i] = str.charCodeAt(i) & 0xff;
    crudo(a);
  };
  const pos = [];
  const objeto = (n, cuerpo) => { pos[n] = largo; texto(n + ' 0 obj\n' + cuerpo + '\nendobj\n'); };

  texto('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const N = jpegs.length;
  const idPag = i => 3 + i*3, idCon = i => 4 + i*3, idImg = i => 5 + i*3;

  objeto(1, '<< /Type /Catalog /Pages 2 0 R >>');
  const kids = jpegs.map((_, i) => idPag(i) + ' 0 R').join(' ');
  objeto(2, '<< /Type /Pages /Kids [' + kids + '] /Count ' + N + ' >>');

  jpegs.forEach((j, i) => {
    objeto(idPag(i),
      '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] ' +
      '/Resources << /XObject << /Im0 ' + idImg(i) + ' 0 R >> >> ' +
      '/Contents ' + idCon(i) + ' 0 R >>');
    const flujo = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    objeto(idCon(i), '<< /Length ' + flujo.length + ' >>\nstream\n' + flujo + '\nendstream');
    // la imagen lleva bytes crudos: no puede pasar por objeto()
    pos[idImg(i)] = largo;
    texto(idImg(i) + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + PDF_W +
          ' /Height ' + PDF_H + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 ' +
          '/Filter /DCTDecode /Length ' + j.length + ' >>\nstream\n');
    crudo(j);
    texto('\nendstream\nendobj\n');
  });

  const total = 3 + N*3;
  const arranque = largo;
  let tabla = 'xref\n0 ' + total + '\n0000000000 65535 f \n';
  for(let n = 1; n < total; n++){
    tabla += String(pos[n] || 0).padStart(10, '0') + ' 00000 n \n';
  }
  texto(tabla + 'trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + arranque + '\n%%EOF\n');

  const fuera = new Uint8Array(largo);
  let o = 0;
  for(const tr of trozos){ fuera.set(tr, o); o += tr.length; }
  return new Blob([fuera], { type: 'application/pdf' });
}

async function pdfDeCartas(cartas, aviso){
  await pdfFuentesListas();
  const med = document.createElement('canvas').getContext('2d');
  const cv = document.createElement('canvas');
  cv.width = PDF_W; cv.height = PDF_H;
  const ctx = cv.getContext('2d');

  const paginas = [];
  for(const c of cartas){
    const fotos = c.sellada ? [] : await pdfFotosDe(c);
    const bloques = pdfComponer(c, fotos, med);
    let pag = [], y = PDF_M;
    for(const b of bloques){
      // una foto mas alta que la caja se encoge en vez de partirse
      if(b.tipo === 'foto' && b.alto > PDF_H - 2*PDF_M){
        const esc = (PDF_H - 2*PDF_M) / b.alto;
        b.alto = Math.floor(b.alto * esc); b.ancho = Math.floor(b.ancho * esc);
      }
      if(y + b.alto > PDF_H - PDF_M && pag.length){ paginas.push(pag); pag = []; y = PDF_M; }
      pag.push(Object.assign({}, b, { y })); y += b.alto;
    }
    if(pag.length) paginas.push(pag);
  }

  const jpegs = [];
  for(let i = 0; i < paginas.length; i++){
    if(aviso) aviso(t('mail_pdf_haciendo') + ' ' + t('mail_pdf_pag') + (i+1) + '/' + paginas.length);
    pdfFondo(ctx);
    paginas[i].forEach(b => pdfDibujar(ctx, b));
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .9));
    jpegs.push(new Uint8Array(await blob.arrayBuffer()));
  }
  return pdfArmar(jpegs);
}

function pdfGuardar(blob, nombre){
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => { try{ URL.revokeObjectURL(u); }catch(e){} }, 4000);
}

function pdfNombre(c){
  const f = new Date(c.creada).toISOString().slice(0, 10);
  const tit = String(c.titulo || '').replace(/[^\w\sáéíóúñÁÉÍÓÚÑ-]/g, '').trim().slice(0, 40);
  return 'carta ' + f + (tit ? ' · ' + tit : '') + '.pdf';
}

async function retirarCarta(){
  const bot = document.getElementById('mail-retirar');
  const st  = document.getElementById('mail-pdf-status');
  if(!MAIL.leida) return;
  if(!MAIL.confirmandoRetiro){          // dos toques: esto no se deshace
    MAIL.confirmandoRetiro = true;
    bot.textContent = t('mail_retirar_sure');
    clearTimeout(MAIL.retTimer);
    MAIL.retTimer = setTimeout(() => {
      MAIL.confirmandoRetiro = false; bot.textContent = t('mail_retirar');
    }, 6000);
    return;
  }
  clearTimeout(MAIL.retTimer);
  MAIL.confirmandoRetiro = false;
  bot.textContent = t('mail_retirar');
  const id = MAIL.leida.id;
  try{
    await mailFetch('/cartas/' + encodeURIComponent(id), { method:'DELETE' });
    const g = store.get(K_LEIDAS) || {}; delete g[id]; store.set(K_LEIDAS, g);
    MAIL.items = MAIL.items.filter(c => c.id !== id);
    MAIL.leida = null;
    setMailState('list'); pintarLista();
    const sl = document.getElementById('mail-list-status');
    sl.className = 'mail-status ok'; sl.textContent = t('mail_retirada');
    cargarLista();
  }catch(e){
    st.style.color = 'var(--err)';
    st.textContent = e.status === 409 ? t('mail_retirar_tarde') : t('mail_err');
    if(e.status === 409) cargarLista();
  }
}

async function descargarCartaPDF(){
  const st = document.getElementById('mail-pdf-status');
  if(!MAIL.leida) return;
  st.style.color = ''; st.textContent = t('mail_pdf_haciendo');
  try{
    const blob = await pdfDeCartas([MAIL.leida], m => { st.textContent = m; });
    pdfGuardar(blob, pdfNombre(MAIL.leida));
    st.textContent = t('mail_pdf_listo');
  }catch(e){ st.style.color = 'var(--err)'; st.textContent = t('mail_pdf_err'); }
}

async function descargarTodoPDF(){
  const st = document.getElementById('mail-list-status');
  st.className = 'mail-status'; st.textContent = t('mail_pdf_haciendo');
  try{
    // de la más antigua a la más nueva: se lee como un fajo en orden
    const orden = MAIL.items.slice().sort((a, b) => a.creada - b.creada);
    const completas = [];
    for(const c of orden){
      if(c.sellada){ completas.push(c); continue; }
      try{ completas.push(await mailFetch('/cartas/' + encodeURIComponent(c.id))); }
      catch(e){ completas.push(c); }
    }
    if(!completas.length){ st.textContent = ''; return; }
    const blob = await pdfDeCartas(completas, m => { st.textContent = m; });
    pdfGuardar(blob, 'cartas · jardín matemático.pdf');
    st.className = 'mail-status ok'; st.textContent = t('mail_pdf_listo');
    cargarLista();
  }catch(e){ st.className = 'mail-status err'; st.textContent = t('mail_pdf_err'); }
}

function arrancarBuzon(){
  const g = store.get(K_TOKEN);
  if(g && g.token){
    MAIL.token = g.token; MAIL.quien = g.quien; MAIL.otro = g.otro; MAIL.nombre = g.nombre;
  }
  const c = store.get(K_CACHE);
  if(c && c.items) MAIL.items = c.items;

  document.getElementById('mail-wrap').dataset.state = MAIL.token ? 'list' : 'lock';
  applyMailLang();
  syncViewLabels();

  // Sin identificarse, la pagina no hace NI UNA peticion: la misma
  // etica que el iframe de YouTube, que no existe hasta pulsar play.
  setTimeout(() => {
    if(MAIL.token){ refrescarResumen(); procesarSalida(); }
    else refrescarAviso();
  }, 1500);
}

// Nada de setInterval: al volver a la pestaña y al abrir el buzon basta.
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ guardarBorrador(true); return; }

// El boton «atras» de Android no puede sacarla del sitio a media carta.
